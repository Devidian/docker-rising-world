name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Validate shell scripts
        run: |
          bash -n entrypoint.sh
          shellcheck entrypoint.sh

      - name: Validate Compose examples
        run: |
          docker compose -f compose.named-volume.yaml config --quiet
          docker compose -f compose.bind-mount.yaml config --quiet

      - name: Run Docker build checks
        run: docker build --check .

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag rising-world-docker:ci \
            .

      - name: Verify image configuration
        run: |
          test "$(docker image inspect rising-world-docker:ci --format '{{.Config.User}}')" = "steam"
          docker image inspect rising-world-docker:ci --format '{{json .Config.Env}}' |
            grep -F '"RW_INSTALL_OZ_TOOLS=false"'
          docker image inspect rising-world-docker:ci --format '{{json .Config.Healthcheck}}' |
            grep -F '"StartPeriod":600000000000'

      - name: Verify non-root volume access
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            rising-world-docker:ci \
            -ec 'test "$(id -u)" = 1000 && test -w /appdata/rising-world/dedicated-server'

      - name: Verify OZ Tools failures are non-fatal
        run: |
          volume="rising-world-oz-tools-${GITHUB_RUN_ID}"
          trap 'docker volume rm --force "${volume}" >/dev/null' EXIT
          docker volume create "${volume}" >/dev/null
          docker run --rm \
            --volume "${volume}:/appdata/rising-world/dedicated-server" \
            --entrypoint /bin/sh \
            rising-world-docker:ci \
            -ec 'ln -s /bin/true /appdata/rising-world/dedicated-server/RisingWorldServer.x64'
          output="$(
            docker run --rm \
              --network none \
              --volume "${volume}:/appdata/rising-world/dedicated-server" \
              --env RW_UPDATE_ON_START=false \
              --env RW_INSTALL_OZ_TOOLS=true \
              rising-world-docker:ci 2>&1
          )"
          printf '%s\n' "${output}"
          grep -F 'WARNING: OZ Tools installation failed; starting the server anyway.' <<<"${output}"
          grep -F 'Starting Rising World dedicated server...' <<<"${output}"
